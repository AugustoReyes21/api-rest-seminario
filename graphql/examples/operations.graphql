# Operaciones ejecutables con nombres y variables.
# Los objetos JSON de variables están en scenarios.json y en este archivo.
# En GraphiQL, copie una operación y sus variables al panel Variables.

# Variables: {"id":"b1"}
query ConsultarLibro($id: ID!) {
  book(id: $id) {
    title
    status
    author { name }
  }
}

# Variables: {"filter":{"status":"AVAILABLE"},"page":{"page":1,"pageSize":3}}
query ListarLibros(
  $filter: BookFilterInput
  $page: PageInput
) {
  books(filter: $filter, page: $page) {
    items {
      id
      title
      author { name }
    }
    pageInfo { page pageSize totalItems totalPages hasNextPage }
  }
}

# Variables: {"input":{"title":"Lecturas para compartir","summary":"Lecturas de la biblioteca.","authorId":"a1"}}
mutation CrearLibro($input: CreateBookInput!) {
  createBook(input: $input) {
    id
    title
    status
    author { name }
  }
}

# Variables: {"id":"b1","status":"BORROWED"}
mutation CambiarEstado($id: ID!, $status: BookStatus!) {
  updateBookStatus(id: $id, status: $status) { id title status }
}

# Variables: {"input":{"title":"   ","authorId":"a1"}}
mutation CrearLibroInvalido($input: CreateBookInput!) {
  createBook(input: $input) { id title }
}

# Variables: {"page":{"page":1,"pageSize":21}}
query ComprobarLimite($page: PageInput) {
  books(page: $page) {
    items { id title }
    pageInfo { pageSize }
  }
}

# Variables: {"id":"b999"}
query ConsultarInexistente($id: ID!) {
  book(id: $id) { id title }
}

# Variables: {"page":{"page":1,"pageSize":3}}
query ListarSoloTitulos($page: PageInput) {
  books(page: $page) {
    items { id title }
    pageInfo { totalItems }
  }
}
