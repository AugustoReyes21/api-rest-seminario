"""Disponibilidad actual del ejemplar en la biblioteca."""
enum BookStatus {
  AVAILABLE
  BORROWED
}

"""Información pública de una persona autora; no expone notas administrativas."""
type Author {
  id: ID!
  name: String!
  """Puede faltar cuando todavía no se ha registrado una biografía."""
  bio: String
}

"""Ejemplar del catálogo que un cliente puede consultar o prestar."""
type Book {
  id: ID!
  title: String!
  """Resumen opcional; null representa un resumen no registrado."""
  summary: String
  status: BookStatus!
  """Autor existente, resuelto mediante carga por lotes por operación."""
  author: Author!
}

"""Todos los filtros presentes se combinan con AND; null equivale a omitirlos."""
input BookFilterInput {
  """Fragmento de título sin distinguir mayúsculas; máximo 120 caracteres."""
  title: String
  authorId: ID
  status: BookStatus
}

"""Página basada en 1. Se rechazan valores fuera del rango permitido."""
input PageInput {
  page: Int! = 1
  """Entre 1 y 20 elementos; el valor predeterminado es 5."""
  pageSize: Int! = 5
}

"""Datos aceptados al crear un ejemplar; su estado inicial es AVAILABLE."""
input CreateBookInput {
  """Entre 1 y 120 caracteres después de quitar espacios al inicio y al final."""
  title: String!
  """Opcional, hasta 1000 caracteres. Se almacena null si está vacío."""
  summary: String
  authorId: ID!
}

"""Metadatos calculados después de aplicar los filtros."""
type PageInfo {
  page: Int!
  pageSize: Int!
  totalItems: Int!
  totalPages: Int!
  hasNextPage: Boolean!
}

"""Colección paginada, nunca nula; una página sin resultados contiene []."""
type BookPage {
  items: [Book!]!
  pageInfo: PageInfo!
}

type Query {
  """Busca un libro por identificador; retorna null y un error NOT_FOUND si no existe."""
  book(id: ID!): Book
  """Filtra libros y devuelve una página estable por orden de incorporación; máximo 20 elementos."""
  books(filter: BookFilterInput, page: PageInput): BookPage!
}

type Mutation {
  """Crea un libro disponible con título válido y autor existente; los errores dejan el campo en null."""
  createBook(input: CreateBookInput!): Book
  """Cambia la disponibilidad de un libro existente; repetir el mismo estado es válido e idempotente."""
  updateBookStatus(id: ID!, status: BookStatus!): Book
}
