name: GraphQL checks
on:
  push:
    paths: ['graphql/**', '.github/workflows/graphql.yml']
  pull_request:
    paths: ['graphql/**', '.github/workflows/graphql.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: graphql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: graphql/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run demo
